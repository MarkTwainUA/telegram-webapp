<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Image Variations Generator</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      min-height: 100vh;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }
    
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }
    
    .upload-section {
      text-align: center;
      margin-bottom: 40px;
      padding: 30px;
      border: 3px dashed #667eea;
      border-radius: 15px;
      background: rgba(102, 126, 234, 0.05);
      transition: all 0.3s ease;
    }
    
    .upload-section:hover {
      border-color: #764ba2;
      background: rgba(118, 75, 162, 0.05);
    }
    
    .file-input {
      display: none;
    }
    
    .upload-btn {
      display: inline-block;
      padding: 15px 30px;
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    
    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    
    .variations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }
    
    .variation-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    
    .variation-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      border-color: #667eea;
    }
    
    .variation-title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
      color: #333;
      font-size: 1.2em;
    }
    
    .variation-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }
    
    .download-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    
    .download-btn:hover {
      background: linear-gradient(45deg, #764ba2, #667eea);
      transform: translateY(-1px);
    }
    
    .original-image {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      margin: 20px 0;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }
    
    .hidden {
      display: none;
    }
    
    /* Variation Effects */
    .variation-1 {
      filter: sepia(100%) hue-rotate(200deg) saturate(150%);
    }
    
    .variation-2 {
      filter: contrast(150%) brightness(110%) saturate(120%);
    }
    
    .variation-3 {
      filter: grayscale(100%) contrast(120%);
    }
    
    .variation-4 {
      filter: hue-rotate(180deg) saturate(200%) brightness(90%);
    }
    
    .variation-5 {
      filter: invert(100%) hue-rotate(180deg);
    }
    
    @media (max-width: 768px) {
      .variations-grid {
        grid-template-columns: 1fr;
      }
      
      .container {
        padding: 20px;
        margin: 10px;
      }
      
      h1 {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Генератор вариаций изображений</h1>
    
    <div class="upload-section">
      <input type="file" id="imageInput" class="file-input" accept="image/*">
      <label for="imageInput" class="upload-btn">
        📸 Загрузить изображение
      </label>
      <p style="margin-top: 15px; color: #666;">
        Поддерживаются форматы: JPG, PNG, GIF, WebP
      </p>
    </div>
    
    <div id="originalSection" class="hidden">
      <h2 style="text-align: center; color: #333;">Оригинальное изображение:</h2>
      <div style="text-align: center;">
        <img id="originalImage" class="original-image" alt="Original">
      </div>
    </div>
    
    <div id="variationsSection" class="hidden">
      <h2 style="text-align: center; color: #333; margin-bottom: 30px;">5 вариаций изображения:</h2>
      <div class="variations-grid">
        <div class="variation-card">
          <div class="variation-title">🌊 Морская волна</div>
          <canvas class="variation-image" id="canvas1"></canvas>
          <button class="download-btn" onclick="downloadVariation(1)">Скачать</button>
        </div>
        
        <div class="variation-card">
          <div class="variation-title">🔥 Яркий контраст</div>
          <canvas class="variation-image" id="canvas2"></canvas>
          <button class="download-btn" onclick="downloadVariation(2)">Скачать</button>
        </div>
        
        <div class="variation-card">
          <div class="variation-title">⚫ Черно-белый</div>
          <canvas class="variation-image" id="canvas3"></canvas>
          <button class="download-btn" onclick="downloadVariation(3)">Скачать</button>
        </div>
        
        <div class="variation-card">
          <div class="variation-title">🌈 Цветовой сдвиг</div>
          <canvas class="variation-image" id="canvas4"></canvas>
          <button class="download-btn" onclick="downloadVariation(4)">Скачать</button>
        </div>
        
        <div class="variation-card">
          <div class="variation-title">🔄 Инверсия</div>
          <canvas class="variation-image" id="canvas5"></canvas>
          <button class="download-btn" onclick="downloadVariation(5)">Скачать</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let originalImageData = null;
    
    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
            // Show original image
            document.getElementById('originalImage').src = event.target.result;
            document.getElementById('originalSection').classList.remove('hidden');
            
            // Store original image data
            originalImageData = {
              image: img,
              src: event.target.result
            };
            
            // Generate variations
            generateVariations(img);
            document.getElementById('variationsSection').classList.remove('hidden');
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
    
    function generateVariations(img) {
      const variations = [
        { // Морская волна
          filter: (imageData) => {
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
              // Sepia + blue tint
              const r = data[i];
              const g = data[i + 1];
              const b = data[i + 2];
              
              data[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189)) * 0.6;
              data[i + 1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168)) * 0.8;
              data[i + 2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131)) * 1.4;
            }
            return imageData;
          }
        },
        { // Яркий контраст
          filter: (imageData) => {
            const data = imageData.data;
            const contrast = 1.5;
            const brightness = 1.1;
            
            for (let i = 0; i < data.length; i += 4) {
              data[i] = Math.min(255, Math.max(0, (data[i] - 128) * contrast + 128) * brightness);
              data[i + 1] = Math.min(255, Math.max(0, (data[i + 1] - 128) * contrast + 128) * brightness);
              data[i + 2] = Math.min(255, Math.max(0, (data[i + 2] - 128) * contrast + 128) * brightness);
            }
            return imageData;
          }
        },
        { // Черно-белый
          filter: (imageData) => {
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
              const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
              data[i] = gray;
              data[i + 1] = gray;
              data[i + 2] = gray;
            }
            return imageData;
          }
        },
        { // Цветовой сдвиг
          filter: (imageData) => {
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
              const r = data[i];
              const g = data[i + 1];
              const b = data[i + 2];
              
              data[i] = Math.min(255, b * 1.2);
              data[i + 1] = Math.min(255, r * 1.1);
              data[i + 2] = Math.min(255, g * 0.9);
            }
            return imageData;
          }
        },
        { // Инверсия
          filter: (imageData) => {
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
              data[i] = 255 - data[i];
              data[i + 1] = 255 - data[i + 1];
              data[i + 2] = 255 - data[i + 2];
            }
            return imageData;
          }
        }
      ];
      
      variations.forEach((variation, index) => {
        const canvas = document.getElementById(`canvas${index + 1}`);
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        canvas.width = 300;
        canvas.height = 250;
        
        // Draw and apply filter
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const filteredData = variation.filter(imageData);
        ctx.putImageData(filteredData, 0, 0);
      });
    }
    
    function downloadVariation(variationNumber) {
      const canvas = document.getElementById(`canvas${variationNumber}`);
      const link = document.createElement('a');
      link.download = `variation_${variationNumber}.png`;
      link.href = canvas.toDataURL();
      link.click();
    }
    
    // Initialize Telegram WebApp if available
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
