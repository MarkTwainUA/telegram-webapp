[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-telegram-server"
version = "0.1.0"
description = "MCP-compliant HTTP/SSE server to manage Telegram channel posts via Bot API"
authors = [{name = "MCP Bot", email = "devnull@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.114.2",
  "uvicorn[standard]==0.30.6",
  "httpx==0.27.2",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "sqlalchemy[asyncio]==2.0.36",
  "aiosqlite==0.20.0",
  "tenacity==9.0.0",
  "slowapi==0.1.9",
  "python-dotenv==1.0.1",
  "structlog==24.4.0",
  "orjson==3.10.7",
  "sse-starlette==2.1.2",
  "itsdangerous==2.2.0",
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "anyio==4.4.0",
  "pytest-cov==5.0.0",
  "ruff==0.6.9",
  "black==24.8.0",
  "pre-commit==4.0.1"
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "B", "I", "UP", "S", "W", "N", "C90"]
ignore = ["S101"]
exclude = [".venv", "build", "dist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --cov=src --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*"]

[tool.setuptools.packages.find]
where = ["src"]

